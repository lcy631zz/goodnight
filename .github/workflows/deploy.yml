# goodnight 网页自动部署到 Netlify（GitHub Actions）
#
# 激活方式（只需你登录自己的账号做一步，Site ID 已内置，无需再配）：
#   1. 代码推到 GitHub 仓库的 main 分支（已完成）。
#   2. 在 Netlify 生成一个 Auth Token：
#        User settings → Applications → Personal access tokens → New access token
#   3. 在 GitHub 仓库 Settings → Secrets and variables → Actions 新增 **1 个** secret：
#        NETLIFY_AUTH_TOKEN  = 上面的 Auth Token
#   （粘贴时即使误带了换行/空格也没关系，工作流会自动剔除空白再使用。）
#   填完之后，以后只要 git push 到 main，就会自动出网页并上线，不用再手拖。
#
# 注意：本仓库根目录就是 Flutter 项目根（lib/、pubspec.yaml 在顶层），
# 所以构建与发布路径都不带任何子目录前缀。

name: Deploy goodnight web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘很挤（预装 Android SDK / .NET / CodeQL 占 ~10GB），
      # flutter build web --release 要写很大的 build/web 输出，磁盘满了会把“Build web”
      # 步骤打红。这里只清掉 web 构建用不到的预装工具，腾出空间。
      - name: Free disk space (remove unused preinstalled tools)
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/gha 2>/dev/null || true
          df -h / || true

      # 免费 runner 只有 7GB 内存，release 模式 dart2js 容易 OOM 把“Build web”打红。
      # 先清盘才有空间建交换分区；fallocate 失败则退回 dd。
      - name: Add swap space (avoid dart2js OOM)
        run: |
          sudo fallocate -l 3G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=3072
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 改成你本地在用的 Flutter 版本，保持两端一致
          flutter-version: '3.24.5'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # --no-source-maps 进一步降低 dart2js 峰值内存与构建耗时
      - name: Build web
        run: flutter build web --release --no-source-maps

      - name: Sanitize Netlify token
        # GitHub 仓库 Secret 有时会被误带首尾换行/回车/空格（从终端或网页复制时很常见），
        # 这些空白会让 Node 在设置 HTTP 头时报 “Is not a legal HTTP header value”。
        # 这里先把 Secret 里的所有空白字符去掉，再写入 $GITHUB_ENV 供下一步使用，
        # 即使你之前粘贴的 Secret 带了换行也能正常部署。
        env:
          RAW_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          echo "NETLIFY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: build/web
          production-deploy: true
        env:
          # Site ID 不是凭据（单有它、没有 token 也调不动 Netlify），直接内置，省得再配一个 secret
          NETLIFY_SITE_ID: e7d1aca1-c301-4777-872b-c3fa5b484293
          # NETLIFY_AUTH_TOKEN 由上一步从 Secret 清洗后写入 $GITHUB_ENV，这里不再直接展开原始 Secret
