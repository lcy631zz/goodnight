# goodnight 网页自动部署到 GitHub Pages（GitHub Actions）
#
# 线上地址：https://lcy631zz.github.io/goodnight/
#
# 为什么从 Netlify 换过来：Netlify 免费套餐改为按月额度（300 credits），
# 额度用尽会直接封锁部署（Error: Forbidden: Account credit usage exceeded），
# 下个账单周期（每月 27 日）才重置。GitHub Pages 对公开仓库免费且无部署次数限制。
#
# 首次启用只需一步（仓库 Settings → Pages → Source 选 "GitHub Actions"）；
# 若还没开，Deploy 步骤会报 "Get Pages site failed"，开了之后重跑即可。
# 之后每次 push 到 main 就会自动构建并上线。
#
# 注意：本仓库根目录就是 Flutter 项目根（lib/、pubspec.yaml 在顶层），
# 所以构建与发布路径都不带任何子目录前缀。

name: Deploy goodnight web

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署：新推送自动取消还在跑的旧部署，防止排队冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘很挤（预装 Android SDK / .NET / CodeQL 占 ~10GB），
      # flutter build web --release 要写很大的 build/web 输出，磁盘满了会把“Build web”
      # 步骤打红。这里只清掉 web 构建用不到的预装工具，腾出空间。
      - name: Free disk space (remove unused preinstalled tools)
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/gha 2>/dev/null || true
          df -h / || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 改成你本地在用的 Flutter 版本，保持两端一致
          flutter-version: '3.24.5'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # --base-href=/goodnight/ ：Pages 项目页挂在仓库子路径下，必须告知资源前缀，
      # 否则 JS/字体/图标会 404、整页白屏。
      # --no-source-maps 进一步降低 dart2js 峰值内存与构建耗时。
      - name: Build web
        run: flutter build web --release --no-source-maps --base-href=/goodnight/

      # SPA 兜底：直接打开或刷新深层路径时，Pages 找不到对应文件会返回 404.html，
      # 复制 index.html 过去即可让 Flutter 接管路由，页面不会 404/白屏。
      - name: SPA fallback (404.html)
        run: cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
