# goodnight 网页自动部署到 Netlify（GitHub Actions）
#
# 激活方式（都需要登录你自己的账号，我无法代做）：
#   1. 把 goodnight/ 这个目录推到 GitHub 仓库的 main 分支。
#   2. 在 Netlify 建一个站点，拿到：
#        - User Settings → Access tokens → 新建一个 Auth Token
#        - 站点设置里的 Site ID
#   3. 在 GitHub 仓库 Settings → Secrets and variables → Actions 里新增两个 secret：
#        NETLIFY_AUTH_TOKEN  = 上面的 Auth Token
#        NETLIFY_SITE_ID    = 上面的 Site ID
#   填完之后，以后只要 git push 到 main，就会自动出网页并上线，不用再手拖。
#
# 注意：本仓库的 Flutter 项目在 goodnight/ 子目录，所以构建和发布路径都带 goodnight/ 前缀。

name: Deploy goodnight web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 改成你本地在用的 Flutter 版本，保持两端一致
          flutter-version: '3.24.5'
          channel: stable

      - name: Get dependencies
        run: cd goodnight && flutter pub get

      - name: Build web
        run: cd goodnight && flutter build web --release

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: goodnight/build/web
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
