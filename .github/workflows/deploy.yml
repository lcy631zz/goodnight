# goodnight 网页自动部署到 Cloudflare Pages（GitHub Actions）
#
# 为什么从 GitHub Pages 换过来：
# - GitHub Pages 在国内走 Fastly CDN，部分校园网/宽带会被 reset 或 DNS 污染，
#   导致该用户自己打不开，甚至 TUN 模式都无效。
# - Netlify 免费套餐改为按月额度（300 credits），用尽即封锁部署（Error: Forbidden）。
# - Cloudflare Pages 免费、无部署次数限制、走 Cloudflare 自家 CDN，
#   在国内通常比 Fastly/GitHub Pages 更易访问。
#
# 首次启用需要你先做（见下方"需要你手动做的"）：
#   1) 注册 Cloudflare 账号；
#   2) 创建一个 Pages 项目（名字默认 goodnight，可在 deploy.yml 里改）；
#   3) 生成 API Token；
#   4) 把 CLOUDFLARE_ACCOUNT_ID 和 CLOUDFLARE_API_TOKEN 填到 GitHub 仓库 Secrets。
# 之后每次 push 到 main 就会自动构建并上传到 Cloudflare Pages。
#
# 注意：本仓库根目录就是 Flutter 项目根（lib/、pubspec.yaml 在顶层），
# 所以构建与发布路径都不带任何子目录前缀。

name: Deploy goodnight web to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只保留一次部署：新推送自动取消还在跑的旧部署，防止排队冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘很挤（预装 Android SDK / .NET / CodeQL 占 ~10GB），
      # flutter build web --release 要写很大的 build/web 输出，磁盘满了会把"Build web"
      # 步骤打红。这里只清掉 web 构建用不到的预装工具，腾出空间。
      - name: Free disk space (remove unused preinstalled tools)
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/gha 2>/dev/null || true
          df -h / || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 改成你本地在用的 Flutter 版本，保持两端一致
          flutter-version: '3.24.5'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # Cloudflare Pages 默认部署在根路径（或你绑定的自定义域名根路径），
      # 不再需要 --base-href=/goodnight/ 这种子路径前缀。
      # --no-source-maps 进一步降低 dart2js 峰值内存与构建耗时。
      - name: Build web
        run: flutter build web --release --no-source-maps

      # SPA 兜底：直接打开或刷新深层路径时，Pages 找不到对应文件会返回 404.html，
      # 复制 index.html 过去即可让 Flutter 接管路由，页面不会 404/白屏。
      - name: SPA fallback (404.html)
        run: cp build/web/index.html build/web/404.html

      # 直接上传到 Cloudflare Pages（不需要 Git 集成）
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: goodnight
          directory: build/web
